<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Квест-планер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Caveat:wght@500;700&family=Marck+Script&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --fb-bg:#f2f2f7;--fb-card:#ffffff;--fb-text:#111114;--fb-hint:#8e8e93;--fb-accent:#2f80ed;--fb-accent-text:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root{--fb-bg:#0e1621;--fb-card:#17212b;--fb-text:#f5f5f5;--fb-hint:#7f8b98;--fb-accent:#5ea2ef;--fb-accent-text:#ffffff}
}
:root{
  --bg:var(--tg-theme-secondary-bg-color,var(--fb-bg));
  --card:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,var(--fb-card)));
  --text:var(--tg-theme-text-color,var(--fb-text));
  --hint:var(--tg-theme-hint-color,var(--fb-hint));
  --accent:var(--tg-theme-button-color,var(--fb-accent));
  --accent-text:var(--tg-theme-button-text-color,var(--fb-accent-text));
  --danger:var(--tg-theme-destructive-text-color,#e5484d);
  --ok:#34c759;--xp:#8b5cf6;--gold:#f5b301;--hp:#ef4444;
  --sep:color-mix(in srgb,var(--text) 9%,transparent);
  --soft:color-mix(in srgb,var(--accent) 13%,transparent);
  --field:color-mix(in srgb,var(--text) 6%,transparent);
  /* безопасные зоны: в полноэкранном режиме Telegram кладёт свои кнопки поверх страницы */
  --top:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));
  --bot:max(env(safe-area-inset-bottom),var(--tg-safe-area-inset-bottom,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(84px + var(--bot));overscroll-behavior-y:none}
body.onboarding{padding-bottom:0}
button{font:inherit;color:inherit;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:calc(14px + var(--top)) 16px 72px}
.hidden{display:none!important}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.sec{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);font-weight:600;margin:20px 4px 8px}
.sec button,.sec .r{border:0;background:none;color:var(--accent);text-transform:none;letter-spacing:0;font-size:13px;font-weight:500;padding:0}
.sec .r{color:var(--hint)}
.meta{color:var(--hint);font-size:13px}
.grow{flex:1;min-width:0}

/* hero */
.herocard{background:linear-gradient(135deg,color-mix(in srgb,var(--xp) 24%,var(--card)),var(--card) 70%)}
.hrow{display:flex;gap:14px;align-items:center}
.avatar{width:64px;height:64px;border-radius:20px;background:color-mix(in srgb,var(--xp) 20%,var(--card));display:flex;align-items:center;justify-content:center;font-size:36px;position:relative;flex:none;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--xp) 50%,transparent)}
.avatar.big{width:88px;height:88px;font-size:50px;border-radius:26px}
.avatar .lvl{position:absolute;right:-7px;bottom:-7px;background:var(--xp);color:#fff;font-size:12px;font-weight:800;min-width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;padding:0 6px;border:2px solid var(--card)}
.hn{font-weight:700;font-size:17px;display:flex;align-items:center;gap:6px}
.hn button{border:0;background:none;color:var(--hint);padding:0 2px;font-size:14px}
.htitle{font-size:13px;color:var(--xp);font-weight:600;margin-bottom:7px}
.xpbar{height:9px;border-radius:5px;background:var(--field);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--xp),#c084fc);border-radius:5px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.xpt{display:flex;justify-content:space-between;font-size:11px;color:var(--hint);margin-top:4px}
.hstats{display:flex;justify-content:space-between;gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid var(--sep);font-size:13px;color:var(--hint)}
.hstats b{color:var(--text)}

/* boss */
.boss{background:linear-gradient(135deg,color-mix(in srgb,var(--hp) 17%,var(--card)),var(--card) 75%)}
.bhead{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.bemoji{font-size:48px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;flex:none;animation:idle 3s ease-in-out infinite}
.bemoji.dead{filter:grayscale(1);transform:rotate(80deg);opacity:.55;animation:none}
.bemoji.hit{animation:hit .5s}
.kicker{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--hp);text-transform:uppercase}
.bname{font-weight:700;font-size:16px}
.hpbar{position:relative;height:22px;border-radius:11px;background:var(--field);overflow:hidden}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#dc2626,#f87171);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.hpbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700}
.bnote{font-size:12px;color:var(--hint);margin-top:8px}
@keyframes idle{50%{transform:translateY(-4px)}}
@keyframes hit{0%,100%{transform:none}15%{transform:translateX(-8px) rotate(-10deg) scale(.9);filter:brightness(2.2) saturate(0)}35%{transform:translateX(7px) rotate(7deg)}55%{transform:translateX(-5px)}75%{transform:translateX(3px)}}

/* quests */
.list{background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:12px}
.quest{display:flex;gap:12px;align-items:center;padding:12px 14px;position:relative}
.quest+.quest::before,.row+.row::before{content:"";position:absolute;top:0;left:50px;right:0;height:1px;background:var(--sep)}
.qicon{width:36px;height:36px;border-radius:11px;background:var(--field);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.qt{font-size:14px;font-weight:500}
.qbar{height:5px;border-radius:3px;background:var(--field);overflow:hidden;margin:6px 0 4px}
.qbar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .5s}
.rw{font-size:12px;font-weight:600;color:var(--hint)}
.rw .x{color:var(--xp)}.rw .g{color:var(--gold)}
.claim{border:0;border-radius:11px;padding:8px 12px;font-weight:800;font-size:13px;background:linear-gradient(135deg,#fcd34d,#f59e0b);color:#3b2600;animation:pulse 1.4s infinite;flex:none}
.qdone{color:var(--ok);font-weight:800;font-size:20px;flex:none;width:30px;text-align:center}
.quest.claimed .qt,.quest.claimed .rw{opacity:.5}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--gold) 25%,transparent)}}

/* rows */
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;position:relative}
.tbody{flex:1;min-width:0;cursor:pointer}
.ttl{word-break:break-word}
.row.done .ttl{color:var(--hint);text-decoration:line-through}
.over{color:var(--danger)}
.chk{width:24px;height:24px;flex:none;border-radius:50%;border:2px solid color-mix(in srgb,var(--hint) 70%,transparent);background:none;padding:0;position:relative;transition:.15s}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk.on::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid var(--accent-text);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.xpb{font-size:11px;font-weight:700;color:var(--xp);background:color-mix(in srgb,var(--xp) 14%,transparent);padding:2px 7px;border-radius:7px;flex:none}
.xpb.p1{color:#f59e0b;background:color-mix(in srgb,#f59e0b 15%,transparent)}
.xpb.p2{color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,transparent)}
.empty{text-align:center;color:var(--hint);padding:26px 16px}
.empty .big{font-size:40px;margin-bottom:6px}
.quick{display:flex;gap:8px;padding:8px 8px 8px 14px;align-items:center}
.quick input{flex:1;border:0;background:none;color:var(--text);font:inherit;outline:none;padding:6px 0;min-width:0}
.quick input::placeholder{color:var(--hint)}
.iconbtn{width:34px;height:34px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-text);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;flex:none}

/* habit pills */
.pills{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.pill{display:flex;align-items:center;gap:10px;border:0;background:var(--card);border-radius:14px;padding:12px;text-align:left;transition:.15s;position:relative;overflow:hidden}
.pill .em{font-size:22px}
.pill .nm{font-size:14px;line-height:1.25;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pill .px{position:absolute;right:8px;top:6px;font-size:10px;font-weight:700;color:var(--xp)}
.pill.on{background:color-mix(in srgb,var(--c) 18%,var(--card));box-shadow:inset 0 0 0 1.5px var(--c)}
.pill.on .px{display:none}
.pill.on::after{content:"✓";position:absolute;right:10px;top:7px;font-size:12px;color:var(--c);font-weight:800}

/* segmented */
.seg{display:flex;background:var(--field);border-radius:11px;padding:3px;margin-bottom:12px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:7px 4px;border-radius:9px;font-size:13px;font-weight:500;color:var(--hint)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* habits */
.habit{padding:12px 14px}
.hhead{display:flex;align-items:center;gap:12px}
.hemoji{width:44px;height:44px;border-radius:13px;background:color-mix(in srgb,var(--c) 18%,transparent);display:flex;align-items:center;justify-content:center;font-size:23px;flex:none}
.hemoji.sm{width:36px;height:36px;font-size:19px;border-radius:11px}
.hname{font-weight:600}
.hcheck{width:42px;height:42px;border-radius:50%;border:2px solid var(--c);background:none;color:var(--c);font-size:18px;font-weight:700;flex:none;transition:.15s}
.hcheck.on{background:var(--c);color:#fff}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0;font-size:11px;color:var(--hint)}
.day i{display:block;width:100%;max-width:34px;aspect-ratio:1;border-radius:9px;background:var(--field);transition:.15s}
.day.on i{background:var(--c)}
.day.off i{opacity:.35;background:repeating-linear-gradient(45deg,var(--field) 0 3px,transparent 3px 6px)}
.day.off.on i{opacity:1;background:var(--c)}
.day.today span{color:var(--text);font-weight:600}

/* kpi & stats */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:22px;font-weight:700;line-height:1.1}
.kpi span{font-size:12px;color:var(--hint)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--hint);font-size:9px}
.chart .val{fill:var(--text);font-weight:600}
.ctitle{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.ctitle b{font-size:15px}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--field)}
.l0{background:color-mix(in srgb,var(--ok) 14%,var(--field))!important}
.l1{background:color-mix(in srgb,var(--ok) 35%,transparent)!important}
.l2{background:color-mix(in srgb,var(--ok) 58%,transparent)!important}
.l3{background:color-mix(in srgb,var(--ok) 80%,transparent)!important}
.l4{background:var(--ok)!important}
.heat .fut{visibility:hidden}
.legend{display:flex;align-items:center;justify-content:flex-end;gap:3px;margin-top:8px;font-size:11px;color:var(--hint)}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.hstat{display:flex;gap:12px;align-items:center;padding:10px 0}
.hstat+.hstat{border-top:1px solid var(--sep)}
.hs-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px}
.hs-top b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--field);overflow:hidden;margin-bottom:4px}
.bar i{display:block;height:100%;border-radius:3px}
/* кликабельная статистика */
.chart .hit{fill:transparent;cursor:pointer;transition:fill .15s}
.chart .hit:hover,.chart .hit:active{fill:color-mix(in srgb,var(--text) 7%,transparent)}
.heat i{cursor:pointer}
.heat i:active{outline:2px solid var(--accent)}
.tap{cursor:pointer;transition:transform .1s}
.tap:active{transform:scale(.97)}
.kpi.tap{position:relative}
.kpi.tap::after{content:"›";position:absolute;right:12px;top:10px;color:var(--hint);font-size:18px}
.kpis.k3{grid-template-columns:repeat(3,1fr)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{font-size:11px;color:var(--hint);text-align:center}
.cal button{aspect-ratio:1;border:0;border-radius:10px;background:var(--card);font-size:13px;padding:0}
.cal button.off{opacity:.4}
.cal button.on{background:var(--c);color:#fff;font-weight:700;opacity:1}
.cal button.miss{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--danger) 55%,transparent)}
.cal button.today{outline:2px solid var(--accent);outline-offset:1px}
.cal button:disabled{opacity:.25;background:none;cursor:default}
.calnav{display:flex;align-items:center;justify-content:space-between;text-align:center;margin-bottom:12px}
.calnav b{font-size:16px}
.calnav button{border:0;background:var(--field);width:36px;height:36px;border-radius:50%;font-size:22px;line-height:1;padding:0 0 3px}
.calnav button:disabled{opacity:.25;cursor:default}
.legend span{display:inline-flex;align-items:center;gap:4px}

/* trophies & shop */
.trophies{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.trophy{background:var(--card);border-radius:14px;padding:12px 6px 10px;text-align:center}
.trophy .ti{font-size:30px;line-height:1.2}
.trophy b{display:block;font-size:12px;margin-top:4px;line-height:1.2}
.trophy span{font-size:10.5px;color:var(--hint);line-height:1.25;display:block;margin-top:3px}
.trophy.locked .ti{filter:grayscale(1);opacity:.25}
.trophy.locked b{color:var(--hint)}
.buy{border:0;border-radius:10px;padding:7px 11px;font-weight:700;font-size:13px;background:color-mix(in srgb,var(--gold) 22%,transparent);flex:none;white-space:nowrap}
.buy.no{opacity:.45}
.slain{display:flex;flex-wrap:wrap;gap:6px;font-size:26px}
.tip{background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 18%,var(--card)),var(--card));position:relative}
.tip ul{margin:8px 0 0;padding-left:18px;font-size:14px}
.tip li{margin:3px 0}
.tip.home{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,var(--card)),var(--card))}
.tip .x{position:absolute;right:10px;top:10px;border:0;background:var(--field);width:26px;height:26px;border-radius:50%;color:var(--hint)}

/* tabbar & fab */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--sep);padding:6px 2px calc(6px + var(--bot));z-index:10}
.tab{flex:1;border:0;background:none;color:var(--hint);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;padding:4px 0}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(78px + var(--bot));width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-text);font-size:30px;line-height:1;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 45%,transparent);z-index:9;display:flex;align-items:center;justify-content:center}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .25s}
.sheet{position:relative;width:100%;max-width:560px;max-height:calc(100vh - var(--top) - 12px);overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + var(--bot));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.open .backdrop{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 10px}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.shead h2{margin:0;font-size:19px}
.close{border:0;background:var(--field);width:30px;height:30px;border-radius:50%;color:var(--hint);font-size:18px;line-height:1}
.field{background:var(--card);border-radius:13px;margin-bottom:10px;overflow:hidden}
.field input,.field textarea{width:100%;border:0;background:none;color:var(--text);font:inherit;padding:13px 14px;outline:none;resize:none}
.field input::placeholder,.field textarea::placeholder{color:var(--hint)}
.field textarea{border-top:1px solid var(--sep);min-height:64px}
.lbl{font-size:13px;color:var(--hint);margin:14px 4px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:0;background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-text)}
.chips input[type=date]{border:0;background:var(--card);color:var(--text);border-radius:10px;padding:7px 10px;font:inherit;font-size:14px;color-scheme:light dark}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{border:0;background:var(--card);border-radius:10px;aspect-ratio:1;font-size:20px;padding:0}
.emojis button.on{box-shadow:inset 0 0 0 2px var(--accent);background:var(--soft)}
.avatars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.avatars button{aspect-ratio:1;border:0;border-radius:14px;background:var(--card);font-size:28px;padding:0}
.avatars button.on{box-shadow:inset 0 0 0 2px var(--xp);background:color-mix(in srgb,var(--xp) 18%,var(--card))}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:32px;height:32px;border-radius:50%;border:0;padding:0;background:var(--c)}
.colors button.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days7 button{border:0;background:var(--card);border-radius:10px;padding:9px 0;font-size:13px;font-weight:500}
.days7 button.on{background:var(--accent);color:var(--accent-text)}
.btn{display:block;width:100%;border:0;border-radius:13px;padding:14px;font-weight:600;font-size:16px;margin-top:18px;background:var(--accent);color:var(--accent-text)}
.btn.ghost{background:none;color:var(--danger);margin-top:6px;font-weight:500}
.btn.alt{background:none;color:var(--accent);margin-top:6px;font-weight:500}
.btn.epic{background:linear-gradient(135deg,var(--xp),#c084fc);color:#fff}

/* onboarding */
.onb{text-align:center;padding-top:16px}
.onb h1{font-size:24px;margin:8px 0 6px}
.onb p{margin:0 auto 6px;max-width:400px}
.onb form{text-align:left;margin-top:12px}
.onb-hero{font-size:68px;animation:idle 3s ease-in-out infinite}
.feat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:16px 0 4px;text-align:left}
.feat div{background:var(--card);border-radius:14px;padding:10px 12px;font-size:13px}
.feat b{display:block;font-size:20px}

/* fx */
.float{position:fixed;transform:translate(-50%,-50%);font-weight:800;font-size:17px;pointer-events:none;z-index:80;white-space:nowrap;color:var(--xp);text-shadow:0 1px 0 var(--card),0 0 8px var(--card);animation:floatup 1.2s ease-out forwards}
.float.neg{color:var(--hint)}
.float.dmg{color:var(--hp);font-size:22px}
@keyframes floatup{0%{opacity:0;margin-top:6px}15%{opacity:1}100%{opacity:0;margin-top:-56px}}

.toast{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.28);border:1px solid var(--sep);animation:tin .4s cubic-bezier(.2,1.3,.4,1),tout .35s 3s forwards}
.toast .ti{font-size:30px}

@keyframes tin{from{opacity:0;transform:translateY(-20px) scale(.95)}}
@keyframes tout{to{opacity:0;transform:translateY(-12px)}}
.modal-wrap{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .25s}
.modal{background:var(--card);border-radius:26px;padding:26px 22px 20px;text-align:center;width:100%;max-width:340px;animation:zoom .45s cubic-bezier(.2,1.4,.4,1)}
.modal .big{font-size:76px;line-height:1.1;display:inline-block;animation:bounce 1.2s ease-in-out infinite}
.modal .kick{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--xp);margin-top:8px}
.modal h2{margin:4px 0 6px;font-size:28px}

.modal .rewards span{background:var(--field);border-radius:12px;padding:8px 12px;font-weight:700}
@keyframes fade{from{opacity:0}}
@keyframes zoom{from{transform:scale(.6);opacity:0}}
@keyframes bounce{50%{transform:translateY(-8px) scale(1.05)}}
.conf{position:fixed;top:-16px;width:9px;height:15px;z-index:95;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}

/* ============ Тема «эстетичный конспект» ============ */
:root{
  --paper:#f8f2ec;--paper2:#fffaf6;--ink:#4b3a3d;--ink2:#9a8587;
  --pink:#efc3c9;--pink2:#f7dfe2;--rose:#c98591;--beige:#e8d9c7;--sage:#a8bb9f;--mauve:#b99ac0;
  --bg:var(--paper);--card:var(--paper2);--text:var(--ink);--hint:var(--ink2);
  --accent:var(--rose);--accent-text:#fff;--danger:#c86b78;--ok:#9cb592;--xp:#a67fb3;--gold:#c09050;--hp:#d98a95;
  --sep:rgba(120,80,85,.15);--soft:rgba(236,188,195,.4);--field:rgba(120,80,85,.07);
  --hand:'Caveat',cursive;--script:'Marck Script',cursive;--tapefont:'Amatic SC',cursive;
  --line:rgba(150,110,115,.16);--shadow:0 1px 0 rgba(150,110,115,.06),0 8px 16px -10px rgba(120,80,85,.35);
  color-scheme:light;
}
html,body{background-color:var(--paper);color:var(--ink);font-family:'Nunito',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background-image:linear-gradient(rgba(190,150,155,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(190,150,155,.13) 1px,transparent 1px);background-size:22px 22px}

/* бумажные карточки */
.card,.list,.kpi,.trophy{border-radius:8px;border:1px solid var(--line);box-shadow:var(--shadow)}
.kpi:nth-child(4n+1){transform:rotate(-.5deg)}.kpi:nth-child(4n+2){transform:rotate(.4deg)}
.kpi:nth-child(4n+3){transform:rotate(.3deg)}.kpi:nth-child(4n){transform:rotate(-.3deg)}
.kpi b{font-family:var(--hand);font-size:32px;font-weight:700;line-height:1}
.kpi span{font-size:12.5px}
.kpi.tap::after{font-family:var(--hand);font-size:22px;top:6px}

/* заголовки разделов — васи-лента */
.sec{color:var(--ink);font-family:var(--tapefont);font-size:25px;font-weight:700;letter-spacing:.05em;margin:26px 2px 12px;align-items:center}
.tape{display:inline-block;padding:3px 16px 1px;background:var(--pink);transform:rotate(-1.3deg);
  clip-path:polygon(0 10%,4% 0,30% 6%,60% 0,96% 5%,100% 0,98% 50%,100% 92%,95% 100%,65% 95%,30% 100%,4% 94%,0 100%,2% 50%)}
.sec:nth-of-type(3n+2) .tape{background:var(--beige);transform:rotate(.9deg)}
.sec:nth-of-type(3n) .tape{background:#e4d6e6;transform:rotate(-.6deg)}
.sec.over .tape{background:#f2b4b9}
.sec .r{font-family:var(--hand);font-size:19px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink2)}
.sec button{font-family:var(--hand);font-size:20px;color:var(--rose);letter-spacing:0;text-transform:none}

/* герой: карточка с полоской ленты сверху */
.herocard{position:relative;background:var(--card);overflow:visible;margin-top:14px}
.herocard::before{content:"";position:absolute;top:-11px;left:50%;width:96px;height:22px;transform:translateX(-50%) rotate(-2deg);background:rgba(239,195,201,.85);
  clip-path:polygon(0 0,100% 6%,97% 50%,100% 100%,0 94%,3% 50%)}
.avatar{background:var(--pink2);border-radius:50%;box-shadow:none;border:1.5px dashed var(--rose)}
.avatar .lvl{background:var(--rose);border-color:var(--paper2);font-family:var(--hand);font-size:16px}
.hn{font-family:var(--script);font-size:29px;font-weight:400;line-height:1.1}
.htitle{font-family:var(--hand);font-size:20px;color:var(--rose);font-weight:500;margin-bottom:6px}
.xpbar{height:10px;border-radius:3px;background:var(--field)}
.xpbar i{border-radius:3px;background:repeating-linear-gradient(45deg,#c7aad0 0 6px,#b694c0 6px 12px)}
.xpt{font-family:var(--hand);font-size:16px}
.hstats{border-top:1px dashed var(--sep);font-size:14px}

/* босс — стикер со скрепкой */
.boss{position:relative;background:#efe4d6;transform:rotate(-.6deg);overflow:visible}

.tip{position:relative;background:var(--pink2)!important;transform:rotate(.6deg);overflow:visible}

.tip>b,.tip .grow>b{font-family:var(--hand);font-size:23px}

/* квесты — пунктирная рамка с бантиком */
.qlist{position:relative;overflow:visible;border:1.5px dashed var(--rose);margin-top:22px}

.quick input::placeholder,.field input::placeholder,.field textarea::placeholder{font-style:italic}

/* привычки */
.pill{border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.pill.on{background:color-mix(in srgb,var(--c) 32%,var(--card));box-shadow:inset 0 0 0 1.5px var(--c)}
.pill.on::after{color:var(--ink)}
.pill .px{font-family:var(--hand);font-size:14px}
.hemoji{border-radius:50%}
.hname{font-weight:700}
.hcheck{border-style:dashed;color:var(--c)}
.hcheck.on{border-style:solid;color:var(--ink)}
.day i{border-radius:50%}
.day span{font-family:var(--hand);font-size:15px}

/* переключатели */
.seg{background:transparent;border:1.5px dashed var(--sep);border-radius:22px}
.seg button{font-family:var(--hand);font-size:20px;color:var(--ink2)}
.seg button.on{background:var(--pink);color:var(--ink);box-shadow:none;border-radius:18px}

/* статистика */
.ctitle b{font-family:var(--hand);font-size:23px}
.chart text{font-family:var(--hand);font-size:12px}
.l0{background:#f3e5e6!important}.l1{background:#efcdd2!important}.l2{background:#e7b3bb!important}
.l3{background:#db98a4!important}.l4{background:#c97c8a!important}
.cal button{border-radius:50%}
.cal button.on{color:var(--ink)}
.calnav b{font-family:var(--script);font-size:22px;font-weight:400}

/* трофеи и лавка */
.trophy b{font-family:var(--hand);font-size:17px;font-weight:700}
.buy{background:var(--beige);font-family:var(--hand);font-size:19px;border-radius:4px;padding:3px 10px}

/* кнопки и формы */
.btn{background:var(--rose);border-radius:24px;font-family:var(--hand);font-size:23px;font-weight:700;padding:10px 14px}
.btn.epic{background:linear-gradient(135deg,#d995a1,#b99ac0)}
.btn.alt{background:none;color:var(--rose)}
.btn.ghost{background:none}
.field{border-radius:8px;border:1px solid var(--line)}
.field textarea{border-top:1px dashed var(--sep)}
.lbl{font-family:var(--hand);font-size:19px;color:var(--ink2)}
.chip{border:1px dashed var(--sep);border-radius:16px}
.chip.on{background:var(--pink);color:var(--ink);border-color:transparent}

/* нижнее меню и кнопка + */
.tabbar{background:rgba(255,250,246,.94);border-top:1.5px dashed rgba(150,110,115,.28)}

.tab.on{color:var(--rose)}
.fab{background:var(--rose);box-shadow:0 6px 16px rgba(201,133,145,.45)}

/* шторка */
.sheet{background-color:var(--paper);background-image:linear-gradient(rgba(190,150,155,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(190,150,155,.13) 1px,transparent 1px);background-size:22px 22px}
.shead h2{font-family:var(--script);font-size:28px;font-weight:400}
.backdrop{background:rgba(75,58,61,.35)}

/* онбординг, уведомления, окна */
.onb h1{font-family:var(--script);font-weight:400;font-size:36px;line-height:1.15}
.feat div{border:1px dashed var(--sep);border-radius:8px}
.toast{background:#fff5f6;border:1px solid var(--pink);border-radius:8px}
.toast b{font-family:var(--hand);font-size:20px}
.modal{position:relative;background:var(--paper);border-radius:10px}
.modal::before{content:"🎀";position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:44px}
.modal h2{font-family:var(--script);font-weight:400;font-size:34px}
.modal .kick{color:var(--rose);font-family:var(--hand);font-size:20px;letter-spacing:.08em}
.float{font-family:var(--hand);font-size:24px;text-shadow:0 1px 0 #fff,0 0 8px #fff}

/* календарь задач: неделя-карточки + таймлайн */
.wk{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:10px 10px 12px}
.wk-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}

.wk-head>button:not(.chip){border:0;background:var(--field);width:32px;height:32px;border-radius:50%;font-size:20px;line-height:1;padding:0 0 2px;flex:none}
.wk-head .chip{padding:2px 10px;font-family:var(--hand);font-size:18px;background:var(--pink2)}
.wk-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wkd{border:0;background:var(--paper);border-radius:12px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 3px 8px -4px rgba(120,80,85,.4);transition:transform .15s,background .15s}

.wkd.on span,.wkd.on b{color:var(--ink)}
.tl{position:relative;padding-left:60px}
.tl::before{content:"";position:absolute;left:53px;top:10px;bottom:10px;border-left:1.5px dashed rgba(201,133,145,.5)}

.tl-time::after{content:"";position:absolute;right:-13px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--rose)}
.tl-plain .tl-card{margin-bottom:10px}
.tl-card{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:7px solid var(--pc);border-radius:10px;padding:11px 12px;box-shadow:var(--shadow)}

.timechips input[type=time]{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:7px 10px;font:inherit;font-size:14px}
</style>

<div class="toasts" id="toasts"></div>

<script>
(() => {
'use strict';
const tg = window.Telegram && window.Telegram.WebApp;
const inTG = !!(tg && tg.initData);
const ver = v => { try { return inTG && tg.isVersionAtLeast(v); } catch { return false; } };
const safe = fn => { try { fn(); } catch {} };

/* ================= utils ================= */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const wd = s => (parse(s).getDay() + 6) % 7; // Пн = 0
const weekStart = s => addDays(s, -wd(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const MONTHS_N = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; };
const fmtDate = s => {
  const t = today();
  if (s === t) return 'Сегодня';
  if (s === addDays(t, 1)) return 'Завтра';
  if (s === addDays(t, -1)) return 'Вчера';
  const d = parse(s);
  return `${WD[wd(s)]}, ${d.getDate()} ${MONTHS[d.getMonth()]}` + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
};
const hash = s => { let h = 2166136261; for (const c of s) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const haptic = {
  tap: () => safe(() => ver('6.1') && tg.HapticFeedback.impactOccurred('light')),
  heavy: () => safe(() => ver('6.1') && tg.HapticFeedback.impactOccurred('heavy')),
  ok: () => safe(() => ver('6.1') && tg.HapticFeedback.notificationOccurred('success')),
  err: () => safe(() => ver('6.1') && tg.HapticFeedback.notificationOccurred('error')),
  sel: () => safe(() => ver('6.1') && tg.HapticFeedback.selectionChanged()),
};
const ask = msg => new Promise(res => {
  if (ver('6.2')) tg.showConfirm(msg, ok => res(!!ok)); else res(window.confirm(msg));
});

/* ================= game content ================= */
const EMOJIS = ['💧','🏃','📚','🧘','💪','🥗','😴','🚭','💊','✍️','🎯','🧹','🎸','🌱','☀️','🦷','🚶','🍎','🧠','💰','📵','🙏','🎨','❤️'];
const OLD_COLORS = ['#2f80ed','#34c759','#ff9500','#ff3b30','#af52de','#32ade6','#ffcc00','#ff2d55'];
const COLORS = ['#e39aa6','#9fbb98','#e2b67f','#b49ccd','#94bcd3','#d4a98e','#c48d9c','#a3b4c8'];
const AVATARS = ['🧙','🧝','🦸','🧛','🧚','🤴','👸','🦊','🐺','🦁','🐱','🐲'];
const REWARD_EMOJIS = ['☕','🍰','🎮','🎬','🍕','😴','🛍️','📱','🍿','🎧','🛁','🍣','🎲','📖','🏖️','🎁'];
const DEFAULT_REWARDS = [['☕', 'Кофе с десертом', 30], ['🎬', 'Серия любимого сериала', 40], ['🎮', 'Час игр без чувства вины', 60], ['😴', 'Поспать подольше', 80], ['🍕', 'Заказать пиццу', 150], ['🛍️', 'Купить себе что-то приятное', 400]];

const BOSSES = [
  { e: '🐉', n: 'Дракон Прокрастинации', d: 'Шепчет: «сделаешь завтра»' },
  { e: '👺', n: 'Гоблин Лени', d: 'Тянет обратно под одеяло' },
  { e: '👻', n: 'Призрак Сомнений', d: 'Твердит, что не получится' },
  { e: '🦑', n: 'Кракен Соцсетей', d: 'Опутывает щупальцами ленты' },
  { e: '🗿', n: 'Голем Рутины', d: 'Превращает дни в серый камень' },
  { e: '👹', n: 'Демон Хаоса', d: 'Разбрасывает дела по углам' },
  { e: '💀', n: 'Лич Выгорания', d: 'Высасывает силы и мотивацию' },
  { e: '🐍', n: 'Гидра Дедлайнов', d: 'На месте одной задачи — две' },
];
const TITLES = [[1, 'Новобранец'], [3, 'Странник'], [5, 'Следопыт'], [8, 'Рыцарь'], [12, 'Ветеран'], [16, 'Мастер'], [20, 'Чемпион'], [25, 'Легенда'], [30, 'Мифический герой']];
const titleFor = L => TITLES.filter(([l]) => L >= l).pop()[1];
const levelCost = L => 80 + L * 40;
function levelInfo(xp) {
  let L = 1, acc = 0;
  while (xp >= acc + levelCost(L)) { acc += levelCost(L); L++; }
  return { level: L, cur: xp - acc, need: levelCost(L), title: titleFor(L) };
}
const taskReward = t => ({ xp: [10, 15, 25][t.prio || 0], gold: [3, 5, 8][t.prio || 0] });
const habitBonus = streakBefore => 6 + Math.min(streakBefore, 14);

// Квесты дня: c = контекст дня

const LS_KEY = 'tg-planner-v1';
const CHUNK = 4000;
const cs = ver('6.9') ? tg.CloudStorage : null;
let cloudN = 0, saveTimer = null;

const csCall = (method, ...args) => new Promise(res => {
  let done = false;
  const t = setTimeout(() => { if (!done) { done = true; res(null); } }, 5000);
  try {
    cs[method](...args, (err, val) => {
      if (done) return; done = true; clearTimeout(t);
      res(err ? null : (val === undefined ? true : val));
    });
  } catch { done = true; clearTimeout(t); res(null); }
});
async function cloudLoad() {
  if (!cs) return null;
  const meta = await csCall('getItem', 'meta');
  if (!meta) return null;
  let m; try { m = JSON.parse(meta); } catch { return null; }
  cloudN = m.n || 0;
  const keys = Array.from({ length: cloudN }, (_, i) => 'c' + i);
  const vals = await csCall('getItems', keys);
  if (!vals) return null;
  try { return JSON.parse(keys.map(k => vals[k] || '').join('')); } catch { return null; }
}
async function cloudSave() {
  if (!cs) return;
  const json = JSON.stringify(S);
  const n = Math.max(1, Math.ceil(json.length / CHUNK));
  for (let i = 0; i < n; i++) await csCall('setItem', 'c' + i, json.slice(i * CHUNK, (i + 1) * CHUNK));
  await csCall('setItem', 'meta', JSON.stringify({ n, updated: S.updated }));
  if (cloudN > n) await csCall('removeItems', Array.from({ length: cloudN - n }, (_, i) => 'c' + (n + i)));
  cloudN = n;
}
async function load() {
  let local = null;
  try { local = JSON.parse(localStorage.getItem(LS_KEY)); } catch {}
  const cloud = await cloudLoad();

/* ================= domain ================= */
const activeHabits = () => S.habits.filter(h => !h.archived);
const scheduled = (h, s) => h.days.includes(wd(s));
const isDone = (h, s) => !!h.log[s];

function streak(h) {
  const T = today();
  let s = T, n = 0;
  for (let i = 0; i < 1000 && s >= h.created; i++, s = addDays(s, -1)) {
    if (!scheduled(h, s)) continue;
    if (isDone(h, s)) n++;
    else if (s !== T) break;
  }
  return n;
}
// Проход по истории привычки: опыт (с бонусом за серию), лучшая серия
function habitHistory(h) {
  const T = today();
  const r = { xp: 0, gold: 0, n: 0, best: 0, days: [] };
  const logDays = Object.keys(h.log).sort();
  let s = logDays.length && logDays[0] < h.created ? logDays[0] : h.created;
  let cur = 0;
  for (let i = 0; s <= T && i < 3000; s = addDays(s, 1), i++) {
    const sch = scheduled(h, s), dn = isDone(h, s);
    if (dn) {
      const x = habitBonus(sch ? cur : 0);
      if (sch) { cur++; r.best = Math.max(r.best, cur); }
      r.xp += x; r.gold += 2; r.n++; r.days.push([s, x]);
    } else if (sch && s !== T) cur = 0;
  }
  return r;
}
function habitRate(h, from, to) {
  let tot = 0, ok = 0;
  for (let s = from > h.created ? from : h.created; s <= to; s = addDays(s, 1)) {
    if (!scheduled(h, s)) continue;
    tot++; if (isDone(h, s)) ok++;
  }
  return tot ? ok / tot : null;
}
function dayHabitRatio(s) {
  const hs = activeHabits().filter(h => h.created <= s && scheduled(h, s));
  if (!hs.length) return null;
  return hs.filter(h => isDone(h, s)).length / hs.length;
}
const tasksDoneOn = s => S.tasks.filter(t => t.done && t.doneAt === s).length;
const daysLabel = d => {
  const k = [...d].sort().join('');
  if (k === '0123456') return 'Каждый день';
  if (k === '01234') return 'По будням';
  if (k === '56') return 'По выходным';
  return [...d].sort().map(i => WD[i]).join(', ');
};
const byPrio = (a, b) => (b.prio || 0) - (a.prio || 0) || (a.created || 0) - (b.created || 0);
const sumDays = (map, from, n) => { let x = 0; for (let i = 0; i < n; i++) x += map[addDays(from, i)] || 0; return x; };

/* ---------- всё игровое состояние выводится из данных ---------- */
function computeAll() {
  const dayXp = Object.assign({}, S.bank.days);
  const add = (d, x) => { dayXp[d] = (dayXp[d] || 0) + x; };
  let xp = S.bank.xp, gold = S.bank.gold, tasksDone = S.bank.tasks, checks = S.bank.checks, best = 0;
  for (const t of S.tasks) if (t.done) {
    const r = taskReward(t); xp += r.xp; gold += r.gold; tasksDone++;
    if (t.doneAt) add(t.doneAt, r.xp);
  }
  for (const h of S.habits) {
    const r = habitHistory(h);
    xp += r.xp; gold += r.gold; checks += r.n;
    r.days.forEach(([d, x]) => add(d, x));
    if (!h.archived) best = Math.max(best, r.best);
  }
  const claims = Object.values(S.claims);
  claims.forEach(c => { xp += c.xp; gold += c.gold; });
  let bosses = 0;
  Object.values(S.bosses).forEach(b => { if (b.claimed) { bosses++; xp += b.reward.xp; gold += b.reward.gold; } });
  Object.values(S.ach).forEach(a => { gold += a.g || 0; });
  const spent = S.purchases.reduce((a, p) => a + p.cost, 0);
  gold -= spent;
  return { xp, gold, tasksDone, checks, best, dayXp, quests: claims.length, bosses, purchases: S.purchases.length, ...levelInfo(xp) };
}
function bossState(all) {
  const T = today(), wk = weekStart(T);
  let b = S.bosses[wk];
  if (!b) {
    const prev = [1, 2].map(k => sumDays(all.dayXp, addDays(wk, -7 * k), 7));
    const avg = (prev[0] + prev[1]) / 2;
    const idx = Math.round(parse(wk).getTime() / (7 * 864e5)) % BOSSES.length;
    b = S.bosses[wk] = { hp: Math.max(150, Math.round(avg * 1.1 / 10) * 10), idx, claimed: false };
  }
  const dmg = sumDays(all.dayXp, wk, 7);
  return { ...b, wk, dmg, left: Math.max(0, b.hp - dmg), def: BOSSES[b.idx], dead: dmg >= b.hp, daysLeft: 6 - wd(T) };
}
function dayCtx(T) {
  const hT = activeHabits().filter(h => scheduled(h, T));
  const doneT = S.tasks.filter(t => t.done && t.doneAt === T);
  return { T, hT, hDone: hT.filter(h => isDone(h, T)).length, doneT, open: S.tasks.filter(t => !t.done) };
}
function dailyQuests(T) {
  const c = dayCtx(T);
  if (!S.quests[T]) {
    const r = rng(hash(T + (S.hero ? S.hero.name : '')));
    const ids = Object.keys(QUESTS).filter(id => !QUESTS[id].need || QUESTS[id].need(c));
    for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    S.quests = { [T]: ids.slice(0, 3) }; // старые дни не нужны
  }
  return S.quests[T].map(id => {
    const q = QUESTS[id];
    const target = Math.max(1, q.target(c));
    const prog = Math.min(target, q.prog(c));
    return { id, ...q, target, prog, ready: prog >= target, claimed: !!S.claims[T + ':' + id] };
  });
}
function perfectDays() {
  const T = today(); let n = 0;
  for (let i = 0; i < 365; i++) { if (dayHabitRatio(addDays(T, -i)) === 1) n++; }
  return n;
}
function game() {
  const all = computeAll();
  const boss = bossState(all);
  return { all, boss };
}
const snap = () => { const g = game(); return { xp: g.all.xp, gold: g.all.gold, level: g.all.level, title: g.all.title, dmg: g.boss.dmg, dead: g.boss.dead }; };
function checkAch() {
  const a = computeAll();
  const st = { ...a, habits: activeHabits().length, perfect: perfectDays() };
  const got = [];
  for (const x of ACH) if (!S.ach[x.id] && x.ok(st)) { S.ach[x.id] = { d: today(), g: x.g }; got.push(x); }
  return got;
}
// Боссы прошлых недель, которых добили, но сундук не открыли, — открываем автоматически
function settleOldBosses() {
  const a = computeAll(), cur = weekStart(today());
  for (const [wk, b] of Object.entries(S.bosses)) {
    if (wk < cur && !b.claimed && sumDays(a.dayXp, wk, 7) >= b.hp) { b.claimed = true; b.reward = { xp: 120, gold: 60 }; }
  }
}

function floatText(x, y, html, cls = '') {
  const d = document.createElement('div');
  d.className = 'float ' + cls; d.innerHTML = html;
  d.style.left = Math.min(Math.max(x, 80), innerWidth - 80) + 'px'; d.style.top = y + 'px';
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 1300);
}
function toast(icon, title, sub) {
  const box = document.getElementById('toasts');
  const d = document.createElement('div');
  d.className = 'toast';
  d.innerHTML = `<div class="ti">${icon}</div><div><b>${title}</b>${sub ? `<span>${sub}</span>` : ''}</div>`;
  box.appendChild(d);
  setTimeout(() => d.remove(), 3500);
}
function confetti(n = 70) {
  const cols = ['#ecbcc3', '#e3d2bf', '#a8bb9f', '#b99ac0', '#f5d6da', '#d9939f', '#c9a063'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('i');
    c.className = 'conf';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = cols[i % cols.length];
    c.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
    c.style.setProperty('--r', (Math.random() * 1080 - 540) + 'deg');
    c.style.animationDuration = 1.6 + Math.random() * 1.6 + 's';
    c.style.animationDelay = Math.random() * .3 + 's';
    if (Math.random() < .4) { c.style.width = '10px'; c.style.height = '10px'; c.style.borderRadius = '50%'; }
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3600);
  }
}
function modal(html) {
  const w = document.createElement('div');
  w.className = 'modal-wrap';
  w.innerHTML = `<div class="modal">${html}<button class="btn epic" data-act="closeModal">Вперёд!</button></div>`;
  document.body.appendChild(w);
}
function levelUpModal(L, newTitle) {
  haptic.heavy(); setTimeout(haptic.ok, 150);
  confetti(110);
  modal(`<div class="big">${S.hero.avatar}</div><div class="kick">НОВЫЙ УРОВЕНЬ</div><h2>Уровень ${L}</h2>
    <div class="meta">${newTitle ? `Новый титул: <b style="color:var(--xp)">${newTitle}</b>` : 'Ты становишься сильнее. Так держать!'}</div>`);
}
function fx(b, m, ev, newAch) {
  const x = ev && ev.clientX ? ev.clientX : innerWidth / 2;
  const y = ev && ev.clientY ? ev.clientY : innerHeight / 2;
  const dx = m.xp - b.xp, dg = m.gold - b.gold;
  if (dx || dg) {
    const parts = [];
    if (dx) parts.push(`${dx > 0 ? '+' : '−'}${Math.abs(dx)} XP`);
    if (dg) parts.push(`<span style="color:var(--gold)">${dg > 0 ? '+' : '−'}${Math.abs(dg)} 💰</span>`);
    floatText(x, y - 14, parts.join(' '), dx < 0 || (!dx && dg < 0) ? 'neg' : '');
  }
  if (m.dmg > b.dmg) {
    const be = app.querySelector('.bemoji');
    if (be) {
      be.classList.remove('hit'); void be.offsetWidth; be.classList.add('hit');
      const r = be.getBoundingClientRect();
      if (r.bottom > 0 && r.top < innerHeight) floatText(r.left + r.width / 2, r.top + 10, '−' + (m.dmg - b.dmg), 'dmg');
    }
  }
  if (!b.dead && m.dead) setTimeout(() => { haptic.heavy(); confetti(90); toast('🏆', 'Босс повержен!', 'Открой сундук в Лагере'); }, 450);
  if (m.level > b.level) setTimeout(() => levelUpModal(m.level, m.title !== b.title ? m.title : null), 600);
  (newAch || []).forEach((a, i) => setTimeout(() => { haptic.ok(); toast(a.i, 'Трофей: ' + a.n, `${a.d} · +${a.g} 💰`); }, 900 + i * 700));
}
// Любое изменение данных: снимок до → изменение → снимок после → эффекты
function change(ev, mutate) {
  const before = snap();
  mutate();
  const mid = snap();
  const newAch = checkAch();
  save(); render();
  fx(before, mid, ev, newAch);
}

function bars(values, labels, color, opts = {}) {
  const W = 320, H = 130, top = 14, bottom = 18;
  const n = values.length;
  const gap = n > 60 ? 1 : n > 20 ? 2 : 6;
  const bw = (W - gap * (n - 1)) / n;
  const max = opts.max || Math.max(1, ...values);
  const every = n <= 7 ? 1 : n <= 31 ? 5 : 15;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart">`;
  values.forEach((v, i) => {
    const x = i * (bw + gap);
    const h = Math.max(v > 0 ? 3 : 2, (v / max) * (H - top - bottom));
    const y = H - bottom - h;
    s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(4, bw / 2).toFixed(1)}" fill="${color}" opacity="${v > 0 ? 1 : .2}"/>`;
    if (n <= 7 && v > 0) s += `<text class="val" x="${(x + bw / 2).toFixed(1)}" y="${(y - 4).toFixed(1)}" text-anchor="middle">${v}</text>`;
    if ((n - 1 - i) % every === 0) s += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 4}" text-anchor="middle">${labels[i]}</text>`;
  });
  // Невидимые зоны нажатия на всю высоту столбца — по ним открывается день
  if (opts.days) values.forEach((v, i) => {
    const x = i * (bw + gap) - gap / 2;
    s += `<rect class="hit" x="${x.toFixed(1)}" y="0" width="${(bw + gap).toFixed(1)}" height="${H}" data-act="dayInfo" data-day="${opts.days[i]}"/>`;
  });
  return s + '</svg>';
}

function viewCalendar() {
  const T = today();
  const sel = ui.calDay || T;
  const ws = weekStart(sel);
  const week = Array.from({ length: 7 }, (_, i) => addDays(ws, i));
  const md = parse(sel);
  const strip = week.map(s => {
    const ts = S.tasks.filter(t => t.due === s);
    const dot = !ts.length ? '' : ts.every(t => t.done) ? 'ok' : 'dot';
    return `<button type="button" class="wkd ${s === sel ? 'on' : ''} ${s === T ? 'today' : ''}" data-act="calDay" data-day="${s}">
      <span>${WD[wd(s)]}</span><b>${parse(s).getDate()}</b><i class="${dot}"></i></button>`;
  }).join('');
  const dayTasks = S.tasks.filter(t => t.due === sel);
  const timed = dayTasks.filter(t => t.time).sort((a, b) => a.time.localeCompare(b.time));
  const untimed = dayTasks.filter(t => !t.time).sort((a, b) => (a.done - b.done) || byPrio(a, b));
  const overdue = sel === T ? S.tasks.filter(t => !t.done && t.due && t.due < T).sort(byPrio) : [];
  const done = dayTasks.filter(t => t.done).length;
  return `<div class="wk">
      <div class="wk-head"><button type="button" data-act="calWeek" data-v="-7" aria-label="Прошлая неделя">‹</button>
        <b>${MONTHS_N[md.getMonth()]} ${md.getFullYear()}</b>

        <button type="button" data-act="calWeek" data-v="7" aria-label="Следующая неделя">›</button></div>
      <div class="wk-days">${strip}</div>
    </div>
    <div class="sec"><span class="tape">${sel === T ? 'Сегодня' : fmtDate(sel)}</span>${dayTasks.length ? `<span class="r">${done}/${dayTasks.length} готово</span>` : ''}</div>

function viewTasks() {
  const T = today();
  const modes = `<div class="seg">${[['cal', '🗓 Календарь'], ['list', '📋 Список']].map(([k, l]) => `<button type="button" class="${(ui.taskMode === 'cal') === (k === 'cal') ? 'on' : ''}" data-act="taskMode" data-v="${k}">${l}</button>`).join('')}</div>`;
  if (ui.taskMode === 'cal') return modes + viewCalendar();
  const f = ui.taskFilter;
  const segs = [['today', 'Сегодня'], ['upcoming', 'Скоро'], ['all', 'Все'], ['done', 'Готово']];
  let html = modes + `<div class="seg">${segs.map(([k, l]) => `<button type="button" class="${f === k ? 'on' : ''}" data-act="filter" data-v="${k}">${l}</button>`).join('')}</div>`;
  const group = (title, arr, cls = '') => arr.length ? `<div class="sec ${cls}"><span class="tape">${title}</span></div><div class="list">${arr.map(taskRow).join('')}</div>` : '';
  const open = S.tasks.filter(t => !t.done);
  if (f === 'today') {
    const over = open.filter(t => t.due && t.due < T).sort(byPrio);
    const tod = open.filter(t => t.due === T).sort(byPrio);
    const doneT = S.tasks.filter(t => t.done && t.doneAt === T);
    html += group('Просрочено', over, 'over') + group('Сегодня', tod) + group('Сделано сегодня', doneT);
    if (!over.length && !tod.length && !doneT.length) html += `<div class="card empty"><div class="big">☀️</div>На сегодня задач нет. Добавь — и бей босса!</div>`;
  } else if (f === 'upcoming' || f === 'all') {
    if (f === 'all') html += group('Просрочено', open.filter(t => t.due && t.due < T).sort(byPrio), 'over');
    const dated = open.filter(t => t.due && (f === 'all' ? t.due >= T : t.due > T));
    const dates = [...new Set(dated.map(t => t.due))].sort();
    dates.forEach(s => { html += group(fmtDate(s), dated.filter(t => t.due === s).sort(byPrio)); });
    if (f === 'all') html += group('Без даты', open.filter(t => !t.due).sort(byPrio));
    if (!dates.length && (f === 'upcoming' || !open.length)) html += `<div class="card empty"><div class="big">📭</div>${f === 'upcoming' ? 'Нет запланированных задач' : 'Список пуст'}</div>`;
  } else {
    const doneAll = S.tasks.filter(t => t.done).sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || '') || (b.doneTs || 0) - (a.doneTs || 0));
    if (doneAll.length) html += `<div class="sec"><span class="tape">Выполнено · ${doneAll.length}</span><button type="button" data-act="clearDone">Очистить</button></div><div class="list">${doneAll.slice(0, 150).map(taskRow).join('')}</div>`;
    else html += `<div class="card empty"><div class="big">✅</div>Выполненных задач пока нет</div>`;
  }
  return html;
}

  <div class="card"><div class="ctitle"><b>Привычки по дням</b><span class="meta">% от плана</span></div>${bars(hVals, labels, 'var(--ok)', { max: 100, days })}</div>

function dayBody(s) {
  const T = today();
  const all = computeAll();
  const xp = all.dayXp[s] || 0;
  const done = S.tasks.filter(t => t.done && t.doneAt === s).sort(byPrio);
  const missed = s <= T ? S.tasks.filter(t => !t.done && t.due === s).sort(byPrio) : [];
  const hs = activeHabits().filter(h => (h.created <= s && scheduled(h, s)) || isDone(h, s));
  const r = dayHabitRatio(s);
  const quests = Object.entries(S.claims).filter(([, c]) => c.d === s).map(([k]) => QUESTS[k.split(':')[1]]).filter(Boolean);
  const nothing = !done.length && !missed.length && !hs.length && !quests.length;
  return `<div class="kpis k3">
      <div class="kpi"><b style="color:var(--xp)">${xp}</b><span>опыта</span></div>
      <div class="kpi"><b>${done.length}</b><span>${plural(done.length, 'задача', 'задачи', 'задач')}</span></div>
      <div class="kpi"><b>${r === null ? '—' : Math.round(r * 100) + '%'}</b><span>привычек</span></div>
    </div>
    ${hs.length ? `<div class="lbl">Привычки · нажми, чтобы отметить</div><div class="list">${hs.map(h => `<div class="row" style="--c:${h.color}">

    </div>`).join('')}</div>` : ''}

    ${missed.length ? `<div class="lbl">${s === T ? 'Ещё не сделано' : 'Не успел в этот день'}</div><div class="list">${missed.map(t => `<div class="row">

function daySheet(s) {

/* ---------- карточка привычки со статистикой и календарём ---------- */
function habitStatBody(h) {
  const T = today();
  const hist = habitHistory(h);
  const r30 = habitRate(h, addDays(T, -29), T), r90 = habitRate(h, addDays(T, -89), T);
  // Календарь месяца: ui.calOff — сколько месяцев назад от текущего
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth() + (ui.calOff || 0);
  const first = ymd(new Date(y, m, 1)), last = ymd(new Date(y, m + 1, 0));
  const md = parse(first);
  let cal = WD.map(w => `<div class="wd">${w}</div>`).join('') + '<span></span>'.repeat(wd(first));
  let mDone = 0, mPlan = 0;
  for (let s = first; s <= last; s = addDays(s, 1)) {
    const n = parse(s).getDate();
    if (s > T) { cal += `<button type="button" disabled>${n}</button>`; continue; }
    const sch = scheduled(h, s) && s >= h.created;
    if (sch) { mPlan++; if (isDone(h, s)) mDone++; }
    const cls = [isDone(h, s) ? 'on' : sch && s < T ? 'miss' : '', scheduled(h, s) ? '' : 'off', s === T ? 'today' : ''].join(' ');
    cal += `<button type="button" class="${cls}" data-act="dayHabit" data-id="${h.id}" data-day="${s}">${n}</button>`;
  }
  const pc = x => x === null ? '—' : Math.round(x * 100) + '%';
  const calBlock = `<div class="card" style="--c:${h.color}">
      <div class="calnav"><button type="button" data-act="calMonth" data-v="-1" aria-label="Предыдущий месяц">‹</button>
        <div><b>${MONTHS_N[md.getMonth()]} ${md.getFullYear()}</b><div class="meta">${mPlan ? `${mDone} из ${mPlan} · ${Math.round(mDone / mPlan * 100)}%` : 'нет запланированных дней'}</div></div>
        <button type="button" data-act="calMonth" data-v="1" ${ui.calOff >= 0 ? 'disabled' : ''} aria-label="Следующий месяц">›</button></div>
      <div class="cal">${cal}</div>
      <div class="legend" style="justify-content:center;gap:10px;margin-top:10px">
        <span><i style="background:${h.color}"></i> сделано</span>
        <span><i style="box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--danger) 55%,transparent)"></i> пропущено</span>
        <span><i style="background:var(--field);opacity:.5"></i> выходной</span></div>
    </div>`;
  return `<div class="meta" style="margin:-6px 4px 10px">Нажми на день, чтобы отметить или снять отметку</div>
    ${calBlock}
    <div class="kpis">
      <div class="kpi"><b>🔥 ${streak(h)}</b><span>текущая серия</span></div>
      <div class="kpi"><b>🏅 ${hist.best}</b><span>рекорд серии</span></div>
      <div class="kpi"><b>${hist.n}</b><span>всего отметок</span></div>
      <div class="kpi"><b style="color:var(--xp)">${hist.xp}</b><span>опыта заработано</span></div>
    </div>
    <div class="card"><div class="hs-top"><span>За 30 дней</span><b>${pc(r30)}</b></div><div class="bar"><i style="width:${r30 === null ? 0 : r30 * 100}%;background:${h.color}"></i></div>
      <div class="hs-top" style="margin-top:8px"><span>За 90 дней</span><b>${pc(r90)}</b></div><div class="bar"><i style="width:${r90 === null ? 0 : r90 * 100}%;background:${h.color}"></i></div></div>
    <div class="meta" style="margin:0 4px">${daysLabel(h.days)} · следующая отметка даст <b style="color:var(--xp)">+${habitBonus(streak(h))} XP</b></div>
    <button type="button" class="btn alt" data-act="editHabit" data-id="${h.id}">✏️ Изменить привычку</button>`;
}

// Удаляемые вещи «сдают» заработанное в банк, чтобы опыт и урон по боссу не пропадали
function bankTask(t) {
  if (!t.done) return;
  const r = taskReward(t);
  S.bank.xp += r.xp; S.bank.gold += r.gold; S.bank.tasks++;
  if (t.doneAt) S.bank.days[t.doneAt] = (S.bank.days[t.doneAt] || 0) + r.xp;
}
function bankHabit(h) {
  const r = habitHistory(h);
  S.bank.xp += r.xp; S.bank.gold += r.gold; S.bank.checks += r.n;
  r.days.forEach(([d, x]) => { S.bank.days[d] = (S.bank.days[d] || 0) + x; });
}
function createHero(f, demo) {
  const name = f.elements.name.value.trim() || 'Странник';
  S.hero = { name, avatar: f.elements.avatar.value, since: today() };
  S.rewards = DEFAULT_REWARDS.map(([emoji, title, cost]) => ({ id: uid(), emoji, title, cost }));
  if (demo) { seed(); S.tipSeen = false; }
  checkAch(); // уже заработанное — без фанфар
  save(); render();
  haptic.ok(); confetti(60);
  setTimeout(() => toast(S.hero.avatar, `Добро пожаловать, ${esc(name)}!`, 'Первый босс уже ждёт в Лагере'), 300);
}

  toggleTask(d, el, ev) {
    const t = S.tasks.find(x => x.id === d.id); if (!t) return;

    t.done ? haptic.ok() : haptic.tap();
  },
  toggleHabit(d, el, ev) {
    const h = S.habits.find(x => x.id === d.id); if (!h) return;

    change(ev, () => {

  dayHabit(d, el, ev) {

    change(ev, () => {
      if (h.log[d.day]) delete h.log[d.day];
      else { h.log[d.day] = 1; if (d.day < h.created) h.created = d.day; }
    });
    h.log[d.day] ? haptic.ok() : haptic.tap();
    refreshSheets();
  },
  claimQuest(d, el, ev) {
    const q = dailyQuests(d.day).find(x => x.id === d.id);
    if (!q || !q.ready || q.claimed) return;
    change(ev, () => { S.claims[d.day + ':' + d.id] = { xp: q.xp, gold: q.gold, d: d.day }; });
    haptic.ok(); confetti(35);
    if (dailyQuests(d.day).every(x => x.claimed)) setTimeout(() => toast('🎉', 'Все квесты дня пройдены!', 'Завтра будут новые'), 700);
  },
  claimBoss(d, el, ev) {
    const g = game();
    if (!g.boss.dead || g.boss.claimed) return;
    change(ev, () => { const b = S.bosses[g.boss.wk]; b.claimed = true; b.reward = { xp: 120, gold: 60 }; });
    haptic.heavy(); confetti(120);
    modal(`<div class="big">🎁</div><div class="kick">ДОБЫЧА</div><h2>${g.boss.def.n} повержен</h2>
      <div class="meta">Неделя за тобой. В понедельник появится новый враг.</div>
      <div class="rewards"><span style="color:var(--xp)">+120 XP</span><span style="color:var(--gold)">+60 💰</span></div>`);
  },
  async buy(d, el, ev) {
    const r = S.rewards.find(x => x.id === d.id); if (!r) return;
    const gold = computeAll().gold;
    if (gold < r.cost) { haptic.err(); toast('💰', `Не хватает ${r.cost - gold} золота`, 'Выполни пару задач или квест дня'); return; }
    if (!(await ask(`Купить «${r.title}» за ${r.cost} золота?`))) return;
    change(ev, () => { S.purchases.push({ rid: r.id, emoji: r.emoji, title: r.title, cost: r.cost, ts: Date.now() }); });
    haptic.ok(); confetti(50);
    toast(r.emoji, 'Награда твоя!', `${esc(r.title)} — заслужено. Наслаждайся`);
  },
  pick(d, el) {
    const form = el.closest('form');
    form.elements[d.name].value = d.v;
    form.querySelectorAll(`[data-act="pick"][data-name="${d.name}"]`).forEach(b => b.classList.toggle('on', b === el));
    haptic.sel();
  },
  pickDay(d, el) { el.classList.toggle('on'); haptic.sel(); },
  preset(d, el) {
    el.closest('form').querySelectorAll('[data-act="pickDay"]').forEach(b => b.classList.toggle('on', d.v.includes(b.dataset.v)));
    haptic.sel();
  },
  async delTask(d) {
    if (!(await ask('Удалить задачу? Заработанный опыт останется.'))) return;
    const t = S.tasks.find(x => x.id === d.id); if (t) bankTask(t);
    S.tasks = S.tasks.filter(x => x.id !== d.id); save(); closeSheet(); render();
  },
  async delHabit(d) {
    if (!(await ask('Удалить привычку? Заработанный опыт останется.'))) return;
    const h = S.habits.find(x => x.id === d.id); if (h) bankHabit(h);
    S.habits = S.habits.filter(x => x.id !== d.id); save(); closeSheet(); render();
  },
  async delReward(d) {
    if (!(await ask('Убрать награду из лавки?'))) return;
    S.rewards = S.rewards.filter(r => r.id !== d.id); save(); closeSheet(); render();
  },
  async clearDone() {
    if (!(await ask('Убрать все выполненные задачи из списка? Опыт и статистика опыта сохранятся.'))) return;
    S.tasks.filter(t => t.done).forEach(bankTask);
    S.tasks = S.tasks.filter(t => !t.done); save(); render();
  },
};

const F = {
  hero(f) { createHero(f, false); },
  heroEdit(f) {
    S.hero.name = f.elements.name.value.trim() || S.hero.name;
    S.hero.avatar = f.elements.avatar.value;
    save(); closeSheet(); render(); haptic.ok();
  },
  quick(f) {
    const title = f.elements.title.value.trim(); if (!title) return;
    S.tasks.push({ id: uid(), title, note: '', due: today(), prio: 0, done: false, doneAt: null, created: Date.now() });
    haptic.tap(); save(); render();
    const inp = app.querySelector('[data-form="quick"] [name=title]'); inp && inp.focus();
  },
  task(f) {
    const e = f.elements;
    const title = e.title.value.trim(); if (!title) return;
    const time = e.time.value || null;
    const data = { title, note: e.note.value.trim(), due: e.due.value || null, prio: +e.prio.value || 0, time, timeEnd: time && e.timeEnd.value > time ? e.timeEnd.value : null };
    closeSheet();
    change(null, () => {
      if (e.id.value) Object.assign(S.tasks.find(t => t.id === e.id.value), data);
      else S.tasks.push({ id: uid(), ...data, done: false, doneAt: null, created: Date.now() });
    });
    haptic.ok();
  },
  habit(f) {
    const e = f.elements;
    const name = e.name.value.trim(); if (!name) return;
    const days = [...f.querySelectorAll('[data-act="pickDay"].on')].map(b => +b.dataset.v);
    if (!days.length) { safe(() => ver('6.2') ? tg.showAlert('Выбери хотя бы один день') : alert('Выбери хотя бы один день')); return; }
    const data = { name, emoji: e.emoji.value, color: e.color.value, days };
    closeSheet();
    change(null, () => {
      if (e.id.value) Object.assign(S.habits.find(h => h.id === e.id.value), data);
      else S.habits.push({ id: uid(), ...data, log: {}, created: today(), archived: false });
    });
    haptic.ok();
  },
  reward(f) {
    const e = f.elements;
    const title = e.title.value.trim(); const cost = Math.max(1, Math.round(+e.cost.value || 0));
    if (!title) return;
    const data = { title, cost, emoji: e.emoji.value };
    if (e.id.value) Object.assign(S.rewards.find(r => r.id === e.id.value), data);
    else S.rewards.push({ id: uid(), ...data });
    S.rewards.sort((a, b) => a.cost - b.cost);
    haptic.ok(); save(); closeSheet(); render();
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = A[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset, el, e); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const fn = F[e.target.dataset.form];
  fn && fn(e.target);
});
document.addEventListener('input', e => {
  if (e.target.dataset.sync === 'due') {
    const v = e.target.value;
    e.target.closest('form').querySelectorAll('[data-name="due"]').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  }
});

/* ================= demo data ================= */
function seed() {
  const rnd = rng(1337);
  const T = today();
  const mk = (name, emoji, color, days, p, len) => {
    const h = { id: uid(), name, emoji, color, days, log: {}, created: addDays(T, -len), archived: false };
    for (let i = len; i >= 1; i--) { const s = addDays(T, -i); if (days.includes(wd(s)) && rnd() < p + (len - i) / len * 0.2) h.log[s] = 1; }
    return h;
  };
  S.habits.push(
    mk('Выпить 2 л воды', '💧', COLORS[0], [0, 1, 2, 3, 4, 5, 6], .7, 80),
    mk('Пробежка', '🏃', COLORS[1], [0, 2, 4], .6, 80),
    mk('Читать 20 минут', '📚', COLORS[2], [0, 1, 2, 3, 4, 5, 6], .65, 60),
    mk('Медитация', '🧘', COLORS[4], [0, 1, 2, 3, 4], .55, 45),
  );
  const task = (title, due, prio = 0, extra = {}) => S.tasks.push({ id: uid(), title, note: '', due, prio, done: false, doneAt: null, created: Date.now() - Math.floor(rnd() * 1e8), ...extra });
  task('Оплатить интернет', addDays(T, -1), 2);
  task('Обновить документы 💻', T, 0, { time: '09:30', timeEnd: '10:00' });
  task('Контент-план 🌷', T, 1, { time: '10:00', timeEnd: '11:00' });
  task('Ревью проекта ✨', T, 2, { time: '11:00', timeEnd: '12:00' });
  task('Разобрать заказы 🛎️', T, 0, { time: '16:00', timeEnd: '16:30' });
  task('Позвонить маме 💌', T, 1, { time: '19:00', timeEnd: '19:30' });
  task('Разобрать почту', T);
  task('Купить продукты', T, 0, { note: 'Молоко, хлеб, яйца, овощи' });
  task('Записаться к стоматологу', addDays(T, 1), 1, { time: '12:00' });
  task('Испечь кексы 🧁', addDays(T, 1), 0, { time: '18:00', timeEnd: '19:30' });
  task('Подготовить отчёт', addDays(T, 3), 2, { time: '10:00', timeEnd: '13:00' });
  task('Сходить в спортзал 🏋️', addDays(T, 2), 0, { time: '08:00', timeEnd: '09:00' });
  task('Придумать подарок другу', null);
  const titles = ['Ответить на письма', 'Уборка', 'Созвон по проекту', 'Погулять с собакой', 'Прочитать статью', 'Заказать воду', 'Обновить резюме', 'Полить цветы', 'Сделать бэкап', 'Встреча с командой'];
  for (let i = 1; i <= 90; i++) {
    const n = Math.floor(rnd() * 4);
    for (let k = 0; k < n; k++) { const s = addDays(T, -i); task(titles[Math.floor(rnd() * titles.length)], s, Math.floor(rnd() * 2.4), { done: true, doneAt: s, doneTs: parse(s).getTime() + 36e6 }); }
  }
  // история боссов: несколько недель назад — кто-то повержен, кто-то ушёл
  const a = computeAll(), wk = weekStart(T);
  for (let k = 8; k >= 1; k--) {
    const w = addDays(wk, -7 * k), dmg = sumDays(a.dayXp, w, 7);
    const win = k % 3 !== 0;
    S.bosses[w] = { hp: Math.max(150, Math.round(dmg * (win ? .85 : 1.25) / 10) * 10), idx: Math.round(parse(w).getTime() / (7 * 864e5)) % BOSSES.length, claimed: win, reward: win ? { xp: 120, gold: 60 } : undefined };
  }
  // пара пройденных квестов и покупка
  for (let i = 1; i <= 12; i++) S.claims[addDays(T, -i) + ':tasks3'] = { xp: 30, gold: 12, d: addDays(T, -i) };
  S.purchases.push({ rid: S.rewards[0].id, emoji: S.rewards[0].emoji, title: S.rewards[0].title, cost: S.rewards[0].cost, ts: Date.now() - 864e5 * 3 });
}

/* ================= boot ================= */
async function boot() {
  if (tg) {
    safe(() => tg.ready());
    safe(() => tg.expand());
    if (ver('6.1')) safe(() => { tg.setHeaderColor('#f8f2ec'); tg.setBackgroundColor('#f8f2ec'); });
    if (ver('7.7')) safe(() => tg.disableVerticalSwipes());
    if (ver('7.10')) safe(() => tg.setBottomBarColor('#fffaf6'));
    if (ver('8.0')) safe(() => {
      tg.onEvent('homeScreenAdded', () => {
        ui.home = 'added'; render(); haptic.ok(); confetti(50);
        toast('📲', 'Иконка добавлена!', 'Теперь планер открывается прямо с главного экрана');
      });
      tg.checkHomeScreenStatus(st => { ui.home = st; render(); });
    });
  }
  await load();
  if (S.hero) {
    settleOldBosses();
    const got = checkAch();
    if (got.length) save();
    render();
    got.forEach((a, i) => setTimeout(() => toast(a.i, 'Трофей: ' + a.n, `${a.d} · +${a.g} 💰`), 600 + i * 700));
  } else render();
}
boot();
})();
